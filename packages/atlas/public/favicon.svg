<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tool's own visual language: an annotation outline with vertex handles
       over dark sky. Colours match the app (--bg / --accent). -->
  <rect width="32" height="32" rx="7" fill="#141825"/>
  <circle cx="8" cy="8" r="1" fill="#c8d0e0" opacity=".7"/>
  <circle cx="25" cy="10" r="1.1" fill="#c8d0e0" opacity=".55"/>
  <circle cx="22" cy="25" r="1" fill="#c8d0e0" opacity=".5"/>
  <path d="M7 20 L12 11 L20 8 L26 15 L21 24 Z"
        fill="#7aa2f7" fill-opacity=".22"
        stroke="#7aa2f7" stroke-width="2.1"
        stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="12" cy="11" r="2.4" fill="#fff" stroke="#7aa2f7" stroke-width="1.4"/>
  <circle cx="26" cy="15" r="2.4" fill="#fff" stroke="#7aa2f7" stroke-width="1.4"/>
</svg>
